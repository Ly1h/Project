[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workbench"
version = "0.1.0"
description = "A practical multi-agent workbench for code/research automation."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0"
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]

[project.scripts]
agent-workbench = "agent_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
